<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>earth — 3d</title>
  </head>
  <body>
    <canvas id="map"></canvas>

    <div id="loader">
      <div class="loader-dot"></div>
      <div class="loader-text">loading</div>
    </div>

    <aside class="panel" id="panel">
      <div class="panel-head">simulation</div>
      <div class="row">
        <button id="btn-pause" class="btn">pause</button>
        <button id="btn-reset" class="btn">reset</button>
      </div>
      <div class="panel-head">speed</div>
      <div class="row">
        <span class="lbl">rotation</span>
        <span class="ctl">
          <input type="range" id="opt-rot" min="0" max="3" step="0.05" value="1" />
          <span class="val" id="val-rot">1.00</span>
        </span>
      </div>
      <div class="row">
        <span class="lbl">moon orbit</span>
        <span class="ctl">
          <input type="range" id="opt-orb" min="0" max="3" step="0.05" value="1" />
          <span class="val" id="val-orb">1.00</span>
        </span>
      </div>
      <div class="panel-foot">drag to orbit · right-drag to pan · scroll to zoom</div>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
